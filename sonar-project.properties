# Unique project identifier in SonarQube
sonar.projectKey=todo1
sonar.projectName=todo1
sonar.projectVersion=1.0

# Source code location
sonar.sources=src/main/java

# Compiled classes location
sonar.java.binaries=target/classes

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage plugin and report
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# SonarQube server
sonar.host.url=http://localhost:9000

# Optional: Login token (replace with your token if authentication is enabled)
